<!-- Supabase → Authentication → Email Templates → Change email address. Oggetto: Conferma la nuova email -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;max-width:520px;margin:0 auto;padding:32px 24px;color:#14120F;background:#F3EFE6">
  <p style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#726A60;margin:0 0 18px">Valmiro</p>
  <h1 style="font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 16px">Confermi la nuova email?</h1>
  <p style="font-size:16px;line-height:1.5;margin:0 0 24px">Hai chiesto di spostare il tuo account Valmiro da {{ .Email }} a {{ .NewEmail }}. Confermalo con un clic.</p>
  <p style="margin:0 0 28px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1F6F5C;color:#fff;text-decoration:none;padding:14px 26px;border-radius:999px;font-weight:600;font-size:15px">Conferma la nuova email</a></p>
  <p style="font-size:13px;line-height:1.5;color:#726A60;margin:0">Se non sei stato tu, ignora il messaggio: l'account resta com'è.</p>
</div>
